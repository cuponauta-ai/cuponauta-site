<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contato — Cuponauta</title>
<link rel="icon" type="image/png" href="assets/favicon.png"/>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:var(--cp-bg);color:var(--cp-fg-1);font-family:var(--cp-font-body);scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% 0%,rgba(42,140,255,.12),transparent 60%),radial-gradient(circle,rgba(122,175,255,.05) 1px,transparent 1.2px) 0 0/22px 22px,var(--cp-bg);min-height:100vh}
:root{--cp-accent:#5BA8FF;--cp-accent-glow:rgba(91,168,255,.45);--cp-accent-glow-strong:rgba(91,168,255,.95)}
::selection{background:var(--cp-accent);color:#03081a}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function Header() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 8);
    window.addEventListener("scroll", fn);
    return () => window.removeEventListener("scroll", fn);
  }, []);
  return (
    <header style={{display:"flex",alignItems:"center",gap:18,padding:"16px clamp(20px,5vw,64px)",background:scrolled?"rgba(3,8,26,.78)":"rgba(3,8,26,.35)",backdropFilter:"blur(14px)",borderBottom:scrolled?"1px solid var(--cp-stroke)":"1px solid transparent",position:"sticky",top:0,zIndex:20,transition:"all 240ms ease"}}>
      <a href="index.html" style={{display:"inline-flex",textDecoration:"none",lineHeight:0}}>
        <img src="assets/logo-cuponauta.png" alt="Cuponauta" style={{height:42,width:"auto",filter:"drop-shadow(0 0 12px var(--cp-accent-glow))"}}/>
      </a>
      <div style={{flex:1}}/>
      <a href="index.html" style={{fontFamily:"var(--cp-font-display)",fontWeight:800,fontSize:13,textTransform:"uppercase",letterSpacing:"0.04em",color:"#03081a",background:"var(--cp-accent)",padding:"10px 18px",borderRadius:999,textDecoration:"none",boxShadow:"0 0 14px var(--cp-accent-glow-strong)"}}>
        Voltar ao site
      </a>
    </header>
  );
}

function Footer() {
  return (
    <footer style={{padding:"56px clamp(20px,5vw,64px) 36px",borderTop:"1px solid var(--cp-stroke)",background:"rgba(3,8,26,.7)"}}>
      <div style={{maxWidth:1240,margin:"0 auto"}}>
        <div style={{display:"flex",flexWrap:"wrap",gap:32,marginBottom:36,justifyContent:"space-between"}}>
          <div style={{maxWidth:280}}>
            <a href="index.html" style={{display:"inline-flex",textDecoration:"none"}}>
              <img src="assets/logo-cuponauta.png" alt="Cuponauta" style={{height:40,filter:"drop-shadow(0 0 10px var(--cp-accent-glow))"}}/>
            </a>
            <p style={{color:"var(--cp-fg-3)",fontFamily:"var(--cp-font-body)",fontSize:13,marginTop:16,lineHeight:1.55}}>As melhores ofertas direto no seu WhatsApp. Sem ruído, sem spam.</p>
          </div>
          <div style={{display:"flex",gap:48,flexWrap:"wrap"}}>
            {[["Ajuda",[["Perguntas frequentes","faq.html"],["Contato","contato.html"],["Termos de uso","termos.html"],["Política de privacidade","privacidade.html"]]]].map(([title,items])=>(
              <div key={title}>
                <div style={{fontFamily:"var(--cp-font-display)",fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:"0.14em",color:"var(--cp-blue-300)",marginBottom:14}}>{title}</div>
                {items.map(([label,href])=>(
                  <a key={label} href={href} style={{display:"block",color:"var(--cp-fg-2)",fontFamily:"var(--cp-font-body)",fontSize:13,marginBottom:10,textDecoration:"none"}}>{label}</a>
                ))}
              </div>
            ))}
          </div>
        </div>
        <div style={{paddingTop:22,borderTop:"1px solid var(--cp-stroke)",display:"flex",justifyContent:"space-between",color:"var(--cp-fg-3)",fontFamily:"var(--cp-font-mono)",fontSize:11,flexWrap:"wrap",gap:12}}>
          <span>© 2026 CUPONAUTA</span><span>FEITO NO BRASIL</span>
        </div>
      </div>
    </footer>
  );
}

const canais = [
  {
    icon: <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>,
    label: "Instagram", handle: "@cuponautaai",
    desc: "Nosso canal principal. Dúvidas, sugestões e novidades.",
    href: "https://www.instagram.com/cuponautaai", cta: "Abrir Instagram", color: "var(--cp-accent)",
  },
  {
    icon: <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/></svg>,
    label: "WhatsApp Bot", handle: "Cuponauta Bot",
    desc: "Fale direto com nosso bot para monitorar preços.",
    href: "https://wa.me/5511940122438", cta: "Abrir no WhatsApp", color: "#25D366",
  },
  {
    icon: <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
    label: "Grupo WhatsApp", handle: "Ofertas do Dia",
    desc: "Entre no grupo e receba as melhores promoções diariamente.",
    href: "https://chat.whatsapp.com/EQi67PsfvaULLCErmDNAHY", cta: "Entrar no grupo", color: "#25D366",
  },
];

function Card({ icon, label, handle, desc, href, cta, color }) {
  const [hover, setHover] = useState(false);
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{background:"linear-gradient(180deg,rgba(15,38,96,.55),rgba(6,17,48,.7))",borderRadius:20,padding:"32px 28px",border:`1px solid ${hover?"var(--cp-stroke-strong)":"var(--cp-stroke)"}`,boxShadow:hover?`0 20px 48px rgba(0,0,0,.5),0 0 20px ${color}33`:"0 8px 24px rgba(0,0,0,.4)",transition:"all 240ms ease",display:"flex",flexDirection:"column",gap:16}}>
      <div style={{width:60,height:60,borderRadius:16,background:"rgba(6,17,48,.8)",display:"flex",alignItems:"center",justifyContent:"center",color,boxShadow:`inset 0 0 0 1.5px ${color}66,0 0 12px ${color}44`}}>
        {icon}
      </div>
      <div>
        <div style={{fontFamily:"var(--cp-font-mono)",fontSize:11,color:"var(--cp-fg-3)",letterSpacing:"0.1em",textTransform:"uppercase"}}>{label}</div>
        <div style={{fontFamily:"var(--cp-font-display)",fontWeight:900,fontSize:22,color:"#fff",textTransform:"uppercase",marginTop:2}}>{handle}</div>
      </div>
      <p style={{fontFamily:"var(--cp-font-body)",fontSize:14,color:"var(--cp-fg-2)",lineHeight:1.6,margin:0,flex:1}}>{desc}</p>
      <a href={href} target="_blank" rel="noopener noreferrer"
        style={{fontFamily:"var(--cp-font-display)",fontWeight:900,fontSize:13,textTransform:"uppercase",letterSpacing:"0.04em",color:"#03081a",background:color,padding:"14px 22px",borderRadius:999,textDecoration:"none",display:"inline-block",textAlign:"center",boxShadow:`0 0 14px ${color}88`}}>
        {cta}
      </a>
    </div>
  );
}

function App() {
  return (
    <div>
      <Header/>
      <section style={{padding:"64px clamp(20px,5vw,64px) 96px",maxWidth:960,margin:"0 auto"}}>
        <div style={{textAlign:"center",marginBottom:56}}>
          <div style={{fontFamily:"var(--cp-font-display)",fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:"0.14em",color:"var(--cp-accent)",marginBottom:12}}>Fale com a gente</div>
          <h1 style={{fontFamily:"var(--cp-font-display)",fontWeight:900,fontSize:"clamp(36px,5vw,64px)",lineHeight:.95,letterSpacing:"-0.025em",textTransform:"uppercase",color:"#fff",margin:"0 0 18px"}}>CONTATO</h1>
          <p style={{fontFamily:"var(--cp-font-body)",fontSize:17,color:"var(--cp-fg-2)",lineHeight:1.6,maxWidth:520,margin:"0 auto"}}>Tem alguma dúvida, sugestão ou quer saber mais? Escolha o canal que preferir.</p>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:20}}>
          {canais.map(c => <Card key={c.label} {...c}/>)}
        </div>
        <div style={{marginTop:64,textAlign:"center"}}>
          <p style={{fontFamily:"var(--cp-font-mono)",fontSize:12,color:"var(--cp-fg-3)",letterSpacing:"0.08em"}}>TEMPO MÉDIO DE RESPOSTA: ATÉ 24H · ATENDIMENTO EM PORTUGUÊS</p>
        </div>
      </section>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
