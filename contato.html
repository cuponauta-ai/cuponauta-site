<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contato — Cuponauta</title>
<link rel="icon" type="image/png" href="assets/favicon.png"/>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--cp-bg); color: var(--cp-fg-1); font-family: var(--cp-font-body); scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(42, 140, 255, 0.12), transparent 60%),
      radial-gradient(circle, rgba(122, 175, 255, 0.05) 1px, transparent 1.2px) 0 0 / 22px 22px,
      var(--cp-bg);
    min-height: 100vh;
  }
  :root { --cp-accent: #5BA8FF; --cp-accent-glow: rgba(91,168,255,0.45); --cp-accent-glow-strong: rgba(91,168,255,0.95); }
  ::selection { background: var(--cp-accent); color: #03081a; }
  @media (max-width: 900px) { .cp-nav { display: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="landing-shell.jsx"></script>
<script type="text/babel" src="page-shell.jsx"></script>
<script type="text/babel">
const { useState } = React;

const canais = [
  {
    icon: (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
      </svg>
    ),
    label: "Instagram",
    handle: "@cuponautaai",
    desc: "Nossa principal canal. Dúvidas, sugestões e novidades.",
    href: "https://www.instagram.com/cuponautaai",
    cta: "Seguir no Instagram",
    color: "var(--cp-accent)",
  },
  {
    icon: (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/>
      </svg>
    ),
    label: "WhatsApp Bot",
    handle: "Cuponauta Bot",
    desc: "Fale direto com nosso bot para monitorar preços.",
    href: "https://wa.me/5511940122438",
    cta: "Abrir no WhatsApp",
    color: "#25D366",
  },
  {
    icon: (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    ),
    label: "Grupo WhatsApp",
    handle: "Ofertas do Dia",
    desc: "Entre no grupo e receba as melhores promoções.",
    href: "https://chat.whatsapp.com/EQi67PsfvaULLCErmDNAHY",
    cta: "Entrar no grupo",
    color: "#25D366",
  },
];

function ChannelCard({ icon, label, handle, desc, href, cta, color }) {
  const [hover, setHover] = useState(false);
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ background: "linear-gradient(180deg, rgba(15,38,96,.55), rgba(6,17,48,.7))", borderRadius: 20, padding: "32px 28px", border: `1px solid ${hover ? "var(--cp-stroke-strong)" : "var(--cp-stroke)"}`, boxShadow: hover ? `0 20px 48px rgba(0,0,0,.5), 0 0 20px ${color}33` : "0 8px 24px rgba(0,0,0,.4)", transition: "all 240ms ease", display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ width: 60, height: 60, borderRadius: 16, background: "rgba(6,17,48,.8)", display: "flex", alignItems: "center", justifyContent: "center", color, boxShadow: `inset 0 0 0 1.5px ${color}66, 0 0 12px ${color}44` }}>
        {icon}
      </div>
      <div>
        <div style={{ fontFamily: "var(--cp-font-mono)", fontSize: 11, color: "var(--cp-fg-3)", letterSpacing: "0.1em", textTransform: "uppercase" }}>{label}</div>
        <div style={{ fontFamily: "var(--cp-font-display)", fontWeight: 900, fontSize: 22, color: "#fff", textTransform: "uppercase", marginTop: 2 }}>{handle}</div>
      </div>
      <p style={{ fontFamily: "var(--cp-font-body)", fontSize: 14, color: "var(--cp-fg-2)", lineHeight: 1.6, margin: 0, flex: 1 }}>{desc}</p>
      <PrimaryButton href={href} style={{ background: color === "#25D366" ? "#25D366" : undefined, boxShadow: color === "#25D366" ? "0 0 14px rgba(37,211,102,.5)" : undefined }}>
        {cta}
      </PrimaryButton>
    </div>
  );
}

function ContatoPage() {
  return (
    <div>
      <Header/>
      <section style={{ padding: "64px clamp(20px, 5vw, 64px) 96px", maxWidth: 960, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 56 }}>
          <Eyebrow color="var(--cp-accent)" style={{ marginBottom: 12 }}>Fale com a gente</Eyebrow>
          <h1 style={{ fontFamily: "var(--cp-font-display)", fontWeight: 900, fontSize: "clamp(36px, 5vw, 64px)", lineHeight: 0.95, letterSpacing: "-0.025em", textTransform: "uppercase", color: "#fff", margin: 0 }}>
            CONTATO
          </h1>
          <p style={{ fontFamily: "var(--cp-font-body)", fontSize: 17, color: "var(--cp-fg-2)", marginTop: 18, lineHeight: 1.6, maxWidth: 520, marginLeft: "auto", marginRight: "auto" }}>
            Tem alguma dúvida, sugestão ou quer saber mais sobre o Cuponauta? Escolha o canal que preferir.
          </p>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 20 }}>
          {canais.map(c => <ChannelCard key={c.label} {...c}/>)}
        </div>
        <div style={{ marginTop: 64, textAlign: "center" }}>
          <p style={{ fontFamily: "var(--cp-font-mono)", fontSize: 12, color: "var(--cp-fg-3)", letterSpacing: "0.08em" }}>
            TEMPO MÉDIO DE RESPOSTA: ATÉ 24H · ATENDIMENTO EM PORTUGUÊS
          </p>
        </div>
      </section>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ContatoPage/>);
</script>
</body>
</html>
