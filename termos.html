<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Termos de Uso — Cuponauta</title>
<link rel="icon" type="image/png" href="assets/favicon.png"/>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:var(--cp-bg);color:var(--cp-fg-1);font-family:var(--cp-font-body);scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% 0%,rgba(42,140,255,.10),transparent 55%),radial-gradient(circle,rgba(122,175,255,.04) 1px,transparent 1.2px) 0 0/22px 22px,var(--cp-bg);min-height:100vh}
:root{--cp-accent:#5BA8FF;--cp-accent-glow:rgba(91,168,255,.45);--cp-accent-glow-strong:rgba(91,168,255,.95)}
::selection{background:var(--cp-accent);color:#03081a}
h2{font-family:var(--cp-font-display);font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff;margin:40px 0 10px}
p,li{font-family:var(--cp-font-body);font-size:15px;color:var(--cp-fg-2);line-height:1.75;margin:0 0 14px}
ul{padding-left:20px;margin:0 0 14px}
li{margin-bottom:6px}
a{color:var(--cp-accent);text-decoration:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function Header() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 8);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return (
    <header style={{display:'flex',alignItems:'center',gap:18,padding:'16px clamp(20px,5vw,64px)',background:scrolled?'rgba(3,8,26,.78)':'rgba(3,8,26,.35)',backdropFilter:'blur(14px)',borderBottom:scrolled?'1px solid var(--cp-stroke)':'1px solid transparent',position:'sticky',top:0,zIndex:20,transition:'all 240ms ease'}}>
      <a href='index.html' style={{display:'inline-flex',textDecoration:'none',lineHeight:0}}>
        <img src='assets/logo-cuponauta.png' alt='Cuponauta' style={{height:42,width:'auto',filter:'drop-shadow(0 0 12px var(--cp-accent-glow))'}}/>
      </a>
      <div style={{flex:1}}/>
      <a href='index.html' style={{fontFamily:'var(--cp-font-display)',fontWeight:800,fontSize:13,textTransform:'uppercase',letterSpacing:'0.04em',color:'#03081a',background:'var(--cp-accent)',padding:'10px 18px',borderRadius:999,textDecoration:'none',boxShadow:'0 0 14px var(--cp-accent-glow-strong)'}}>Voltar ao site</a>
    </header>
  );
}

function Footer() {
  const links = [['FAQ','faq.html'],['Contato','contato.html'],['Termos','termos.html'],['Privacidade','privacidade.html']];
  return (
    <footer style={{padding:'48px clamp(20px,5vw,64px) 32px',borderTop:'1px solid var(--cp-stroke)',background:'rgba(3,8,26,.7)'}}>
      <div style={{maxWidth:1240,margin:'0 auto',display:'flex',flexWrap:'wrap',justifyContent:'space-between',alignItems:'center',gap:20}}>
        <a href='index.html'><img src='assets/logo-cuponauta.png' alt='Cuponauta' style={{height:36,filter:'drop-shadow(0 0 8px var(--cp-accent-glow))'}}/></a>
        <div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
          {links.map(([l,h]) => <a key={l} href={h} style={{fontFamily:'var(--cp-font-body)',fontSize:13,color:'var(--cp-fg-2)',textDecoration:'none'}}>{l}</a>)}
        </div>
        <span style={{fontFamily:'var(--cp-font-mono)',fontSize:11,color:'var(--cp-fg-3)'}}>© 2026 CUPONAUTA</span>
      </div>
    </footer>
  );
}

function App() {
  return (
    <div>
      <Header/>
      <section style={{padding:'64px clamp(20px,5vw,64px) 96px',maxWidth:760,margin:'0 auto'}}>
        <div style={{marginBottom:48}}>
          <div style={{fontFamily:'var(--cp-font-display)',fontWeight:700,fontSize:12,textTransform:'uppercase',letterSpacing:'0.14em',color:'var(--cp-accent)',marginBottom:12}}>Legal</div>
          <h1 style={{fontFamily:'var(--cp-font-display)',fontWeight:900,fontSize:'clamp(36px,5vw,60px)',lineHeight:.95,letterSpacing:'-0.025em',textTransform:'uppercase',color:'#fff',margin:'0 0 16px'}}>TERMOS DE USO</h1>
          <p style={{fontFamily:'var(--cp-font-mono)',fontSize:12,color:'var(--cp-fg-3)',letterSpacing:'0.08em',margin:0}}>ÚLTIMA ATUALIZAÇÃO: MAIO DE 2026</p>
        </div>

        <div style={{background:'linear-gradient(180deg,rgba(15,38,96,.4),rgba(6,17,48,.6))',borderRadius:16,padding:'24px 28px',border:'1px solid rgba(91,168,255,.25)',marginBottom:40}}>
          <p style={{margin:0}}>Ao usar os serviços do <strong style={{color:'#fff'}}>Cuponauta</strong> (bot de monitoramento e grupo de ofertas no WhatsApp), você concorda com os termos abaixo.</p>
        </div>

        <h2>1. Sobre o Cuponauta</h2>
        <p>O Cuponauta é uma plataforma brasileira de ofertas e cupons que funciona via WhatsApp. A receita vem de links de afiliados das principais lojas de e-commerce do Brasil.</p>

        <h2>2. Como você pode usar</h2>
        <p>Ao usar o Cuponauta, você concorda em:</p>
        <ul>
          <li>Usar os serviços só para fins pessoais, não comerciais</li>
          <li>Não redistribuir conteúdos do grupo sem autorização</li>
          <li>Não usar os serviços para fins ilegais</li>
          <li>Manter um comportamento respeitoso nos canais do Cuponauta</li>
        </ul>

        <h2>3. Links de afiliados</h2>
        <p>Quando você compra por um link que a gente indica, podemos receber uma comissão da loja. Isso não gera nenhum custo a mais para você. Os preços são os mesmos das lojas.</p>

        <h2>4. Preços e disponibilidade</h2>
        <p>Os preços podem mudar a qualquer hora pelas lojas parceiras, sem aviso prévio. O Cuponauta não se responsabiliza por alterações depois da divulgação.</p>

        <h2>5. O que não é nossa responsabilidade</h2>
        <ul>
          <li>Qualidade, entrega ou características dos produtos anunciados</li>
          <li>Problemas nas transações feitas nas plataformas parceiras</li>
          <li>Indisponibilidade temporária dos serviços por motivos técnicos</li>
        </ul>

        <h2>6. Propriedade intelectual</h2>
        <p>Nome, logo, mascote, textos e design do Cuponauta são de nossa propriedade. Reprodução sem autorização é proibida.</p>

        <h2>7. Mudanças nestes termos</h2>
        <p>Podemos atualizar estes termos quando precisar. O uso continuado dos serviços significa que você aceitou as mudanças.</p>

        <h2>8. Contato</h2>
        <p>Dúvidas? Fale com a gente pelo Instagram <a href='https://www.instagram.com/cuponautaai' target='_blank' rel='noopener noreferrer'>@cuponautaai</a> ou pela <a href='contato.html'>página de contato</a>.</p>
      </section>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
